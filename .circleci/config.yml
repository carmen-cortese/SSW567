version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r GitHubApi567-hw03a/requirements.txt
      - run:
          name: Run HW02 triangle tests
          command: cd triangle_testing && python -m unittest -v test_classify_triangle.py
      - run:
          name: Run HW03a GitHub API tests
          command: cd GitHubApi567-hw03a && python -m unittest -v test_github_api.py
      - run:
          name: Run HW03a tests against the real GitHub API
          command: cd GitHubApi567-hw03a && python -m unittest -v test_github_api_live.py

workflows:
  build-and-test:
    jobs:
      - test
